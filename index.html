<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3efe6" />
  <title>记得住</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f6b52'/%3E%3Ccircle cx='10' cy='12' r='3' fill='%23fff'/%3E%3Ccircle cx='22' cy='12' r='3' fill='%23e3b341'/%3E%3Ccircle cx='10' cy='22' r='3' fill='%23e36b2c'/%3E%3Ccircle cx='22' cy='22' r='3' fill='%23d23b3b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="topbar">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <h1>记得住</h1>
            <p>记账、放哪儿了、什么时候过期</p>
          </div>
        </div>
        <button type="button" class="btn primary" id="btn-add">记一笔</button>
      </header>
      <nav class="tabs" aria-label="视图">
        <button type="button" class="tab" id="tab-ledger" data-view="ledger" role="tab" aria-selected="true" aria-controls="main">账本</button>
        <button type="button" class="tab" id="tab-place" data-view="place" role="tab" aria-selected="false" aria-controls="main">位置</button>
        <button type="button" class="tab" id="tab-status" data-view="status" role="tab" aria-selected="false" aria-controls="main">状态墙 <span id="status-badge" class="badge" hidden>0</span></button>
      </nav>
    </div>
    <main id="main" tabindex="-1"></main>
    <footer class="foot">
      <p id="foot-note">数据只存在这台浏览器里，刷新不会丢。换电脑或清缓存之前，记得导出一份备份。</p>
      <div class="foot-actions">
        <button type="button" class="btn" id="btn-export">导出备份</button>
        <label class="btn file-btn">导入备份
          <input id="file-import" type="file" accept="application/json,.json" />
        </label>
      </div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
